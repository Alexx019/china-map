<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Visor de fotos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<div role="img" aria-label="Foto 1 de 4 de la Librería Zhongshuge" style="position: absolute; left: 0; top: 150px; width: 390px; height: 544px; background: linear-gradient(180deg, #675047 0%, #796156 55%, #59423b 100%)"></div>

<div style="position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%)"></div>
<a href="Ficha.dc.html" aria-label="Cerrar el visor" style="position: absolute; left: 16px; top: 54px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.16); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
</a>
<div style="position: absolute; left: 0; right: 0; top: 66px; text-align: center; font-size: 15px; font-weight: 600; pointer-events: none">1 de 4</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 34px; background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%); display: flex; flex-direction: column; gap: 14px">
<div>
<div style="font-size: 18px; font-weight: 700; letter-spacing: -0.015em">Librería Zhongshuge</div>
<div style="font-size: 13.5px; color: rgba(255,255,255,0.72); margin-top: 2px">Bao'an · OH BAY</div>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{thumbs}}" as="th" hint-placeholder-count="4">
<button type="button" aria-label="{{th.label}}" style="width: 56px; height: 56px; border-radius: 12px; padding: 0; border: {{th.border}}; background: {{th.bg}}; opacity: {{th.op}}"></button>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var g = function (a) { return 'linear-gradient(180deg, ' + a[0] + ' 0%, ' + a[1] + ' 55%, ' + a[2] + ' 100%)'; };
    var photos = [
      ['#675047', '#796156', '#59423b'],
      ['#7f7469', '#978470', '#675f58'],
      ['#584545', '#635758', '#0b0b0a'],
      ['#c4aeb2', '#c9a2a2', '#ab8d8b']
    ];
    return {
      thumbs: photos.map(function (p, i) {
        return {
          bg: g(p),
          label: 'Ver foto ' + (i + 1) + ' de 4',
          border: i === 0 ? '2px solid #FFFFFF' : '2px solid transparent',
          op: i === 0 ? 1 : 0.6
        };
      })
    };
  }
}
</script>
</body>
</html>
