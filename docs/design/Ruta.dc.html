<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ruta creada por el grupo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}
</style>
</helmet>

<rect x="0" y="0" width="390" height="844" fill="#ECEEF1"></rect>
<g stroke="#F8F9FA" stroke-width="2.5" fill="none" stroke-linecap="round">
<path d="M90 40 L380 70"></path>
<path d="M100 120 L390 132"></path>
<path d="M230 0 L250 330"></path>
<path d="M330 0 L336 330"></path>
<path d="M160 0 L170 120"></path>
</g>
<path d="M276 196 C 306 186 340 192 350 214 C 356 236 336 252 312 254 C 288 256 270 240 270 222 C 270 210 272 200 276 196 Z" fill="#D6E5D4"></path>
<path d="M0 0 L 40 0 C 50 80 60 160 70 230 C 80 290 120 330 200 340 L 390 352 L 390 844 L 0 844 Z" fill="#C6DAEA"></path>
<g stroke="#D8DCE2" stroke-width="10" fill="none" stroke-linecap="round">
<path d="M60 186 C 160 176 280 190 390 172"></path>
<path d="M190 0 C 196 100 200 200 214 330"></path>
</g>
<g stroke="#FFFFFF" stroke-width="6.5" fill="none" stroke-linecap="round">
<path d="M60 186 C 160 176 280 190 390 172"></path>
<path d="M190 0 C 196 100 200 200 214 330"></path>
</g>
<polyline points="140,140 104,232 226,276" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></polyline>
<polyline points="140,140 104,232 226,276" fill="none" stroke="#D23A2A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline>
</svg>
<div role="img" aria-label="Parada 1: Librería Zhongshuge" style="position: absolute; left: 125px; top: 125px; width: 30px; height: 30px; border-radius: 15px; background: #D23A2A; border: 2.5px solid #FFFFFF; box-sizing: border-box; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(17,19,24,0.25)">1</div>
<div role="img" aria-label="Parada 2: Paseo de OH BAY" style="position: absolute; left: 89px; top: 217px; width: 30px; height: 30px; border-radius: 15px; background: #D23A2A; border: 2.5px solid #FFFFFF; box-sizing: border-box; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(17,19,24,0.25)">2</div>
<div role="img" aria-label="Parada 3: Noria Bay Glory" style="position: absolute; left: 211px; top: 261px; width: 30px; height: 30px; border-radius: 15px; background: #D23A2A; border: 2.5px solid #FFFFFF; box-sizing: border-box; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(17,19,24,0.25)">3</div>

<a href="Main.dc.html" aria-label="Volver a la lista de rutas" style="position: absolute; left: 16px; top: 54px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.80); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(17,19,24,0.07); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(17,19,24,0.10)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111318" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</a>

<div style="position: absolute; left: 0; right: 0; top: 330px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,0.12); overflow: hidden">
<div style="width: 36px; height: 5px; border-radius: 3px; background: rgba(17,19,24,0.18); margin: 8px auto 0"></div>
<div style="padding: 12px 20px 0; display: flex; align-items: center; gap: 10px">
<h1 style="flex: 1; margin: 0; font-size: 26px; line-height: 1.1; font-weight: 750; letter-spacing: -0.025em">Tarde por Bao'an</h1>
<button type="button" aria-label="Cambiar el nombre de la ruta" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #F4F5F7; display: flex; align-items: center; justify-content: center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#111318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.17 6.81a1 1 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"></path></svg>
</button>
</div>
<p style="margin: 4px 20px 0; font-size: 14px; color: #5B6270">3 paradas, compartida con el grupo</p>

<div style="display: flex; align-items: flex-start; padding: 16px 20px 0; overflow: hidden">
<sc-for list="{{stops}}" as="s" hint-placeholder-count="3">
<sc-if value="{{s.notFirst}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="flex-shrink: 0; width: 14px; height: 2px; margin-top: 39px; background: #D23A2A"></div>
</sc-if>
<div style="flex-shrink: 0; width: 104px; display: flex; flex-direction: column; gap: 7px">
<div style="position: relative; width: 104px; height: 80px; border-radius: 14px; background: {{s.bg}}">
<span style="position: absolute; left: 6px; top: 6px; width: 24px; height: 24px; border-radius: 12px; background: #D23A2A; border: 2px solid #FFFFFF; box-sizing: border-box; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.n}}</span>
<span aria-hidden="true" style="position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 12px; background: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#5B6270" stroke="none" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></span>
</div>
<div style="font-size: 13.5px; font-weight: 600; line-height: 1.25">{{s.name}}</div>
</div>
</sc-for>
<div aria-hidden="true" style="flex-shrink: 0; width: 14px"></div>
<button type="button" style="flex-shrink: 0; width: 104px; height: 80px; border-radius: 14px; border: 1.5px dashed #B9BEC6; background: transparent; color: #5B6270; font: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Añadir</button>
</div>
<p style="margin: 10px 20px 0; font-size: 12.5px; color: #5B6270">Mantén pulsada una parada y arrástrala para cambiar el orden.</p>

<h2 style="margin: 18px 20px 4px; font-size: 16px; font-weight: 700">Tramos en Amap</h2>
<div style="padding: 0 20px">
<sc-for list="{{legs}}" as="leg" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid rgba(17,19,24,0.07)">
<span style="flex-shrink: 0; height: 26px; padding: 0 9px; border-radius: 13px; background: #F4F5F7; font-size: 12.5px; font-weight: 700; display: flex; align-items: center">{{leg.n}}</span>
<span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{leg.label}}</span>
<button type="button" style="flex-shrink: 0; height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid #D23A2A; background: #FFFFFF; color: #B42F21; font: inherit; font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 6px">
<svg width="13" height="13" viewBox="0 0 24 24" fill="#B42F21" stroke="#B42F21" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>Abrir</button>
</div>
</sc-for>
</div>
</div>

<nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: rgba(255,255,255,0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(17,19,24,0.10); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-top: 8px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B6270">
<span style="width: 60px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.1 5.55a2 2 0 0 0 1.8 0l3.65-1.83A1 1 0 0 1 21 4.62v12.76a1 1 0 0 1-.55.9l-4.56 2.27a2 2 0 0 1-1.78 0l-4.22-2.1a2 2 0 0 0-1.78 0l-3.66 1.83A1 1 0 0 1 3 19.38V6.62a1 1 0 0 1 .55-.9l4.56-2.27a2 2 0 0 1 1.78 0z"></path><path d="M15 5.76v15"></path><path d="M9 3.24v15"></path></svg></span>
<span style="font-size: 12px; font-weight: 500">Explorar</span>
</a>
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B6270">
<span style="width: 60px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6270" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg></span>
<span style="font-size: 12px; font-weight: 500">Guardados</span>
</a>
<a href="Ruta.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111318">
<span style="width: 60px; height: 32px; border-radius: 16px; background: rgba(17,19,24,0.07); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"></circle><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"></path><circle cx="18" cy="5" r="3"></circle></svg></span>
<span style="font-size: 12px; font-weight: 650">Rutas</span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var g = function (a) { return 'linear-gradient(180deg, ' + a[0] + ' 0%, ' + a[1] + ' 55%, ' + a[2] + ' 100%)'; };
    var stops = [
      ['Librería Zhongshuge', ['#675047', '#796156', '#59423b']],
      ['Paseo de OH BAY', ['#5c8dc5', '#7d96b0', '#615d58']],
      ['Noria Bay Glory', ['#bb809c', '#8f685d', '#4e4a49']]
    ];
    return {
      stops: stops.map(function (s, i) { return { n: i + 1, name: s[0], bg: g(s[1]), notFirst: i > 0 }; }),
      legs: [
        { n: '1 → 2', label: 'Zhongshuge → Paseo de OH BAY' },
        { n: '2 → 3', label: 'Paseo de OH BAY → Noria Bay Glory' }
      ]
    };
  }
}
</script>
</body>
</html>
