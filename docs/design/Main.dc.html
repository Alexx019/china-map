<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var light = {
      land: '#ECEEF1', water: '#C6DAEA', park: '#D6E5D4', road: '#FFFFFF', roadCase: '#D8DCE2', minor: '#F8F9FA',
      label: '#5B6270', waterLabel: '#4D7593', halo: '#ECEEF1',

      sheet: '#FFFFFF', text: '#111318', text2: '#5B6270', hair: 'rgba(17,19,24,0.10)', grab: 'rgba(17,19,24,0.18)',
      nav: 'rgba(255,255,255,0.94)', navActive: 'rgba(17,19,24,0.07)',
      cluster: '#111318', clusterText: '#FFFFFF', clusterRing: 'rgba(17,19,24,0.12)', ring: '#FFFFFF',
      markerShadow: '0 2px 8px rgba(17,19,24,0.25)'
    };
    var night = {
      land: '#14181F', water: '#0D2232', park: '#15261D', road: '#2A313C', roadCase: '#1A1F27', minor: '#1B2028',
      label: '#9AA1AD', waterLabel: '#6E93AE', halo: '#14181F',
      glass: 'rgba(28,31,38,0.78)', glassBorder: 'rgba(255,255,255,0.08)', chipBg: 'rgba(30,33,40,0.86)',
      chipSel: '#F2F3F5', chipSelText: '#111318', shadow: '0 4px 16px rgba(0,0,0,0.40)',
      sheet: '#16181D', text: '#F2F3F5', text2: '#9AA1AD', hair: 'rgba(255,255,255,0.10)', grab: 'rgba(255,255,255,0.24)',
      nav: 'rgba(22,24,29,0.94)', navActive: 'rgba(255,255,255,0.10)',
      cluster: '#F2F3F5', clusterText: '#111318', clusterRing: 'rgba(242,243,245,0.16)', ring: '#F2F3F5',
      markerShadow: '0 2px 10px rgba(0,0,0,0.55)'
    };
    var g = function (a) { return 'linear-gradient(180deg, ' + a[0] + ' 0%, ' + a[1] + ' 55%, ' + a[2] + ' 100%)'; };
    return {
      t: dark ? night : light,
      zsgBg: g(['#675047', '#796156', '#59423b']),
      norBg: g(['#bb809c', '#8f685d', '#4e4a49']),
      chips: [
        { l: 'Ver y hacer', c: '#2F8C6E' },
        { l: 'Comer', c: '#B87719' },
        { l: 'Comprar', c: '#3567C9' },
        { l: 'De noche', c: '#6550C8' }
      ],
      zones: ["Bao'an · OH BAY", 'Nanshan · la bahía', 'Futian · el centro', 'Huaqiangbei', 'Luohu · el Shenzhen de antes', 'Longgang · arte y hakka', 'Costa este'],
      cards: [
        { name: 'Librería Zhongshuge', cat: 'Ver y hacer', c: '#2F8C6E', bg: g(['#675047', '#796156', '#59423b']) },
        { name: 'Noria Bay Glory', cat: 'De noche', c: '#6550C8', bg: g(['#bb809c', '#8f685d', '#4e4a49']) },
        { name: 'Paseo de OH BAY', cat: 'Comer', c: '#B87719', bg: g(['#5c8dc5', '#7d96b0', '#615d58']) }
      ]
    };
  }
}
</script>
