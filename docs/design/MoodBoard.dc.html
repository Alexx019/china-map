<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mood board de Bao'an</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #111318; font-family: 'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<div style="padding: 54px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Ficha.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 22px; background: #F4F5F7; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111318" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</a>
<a href="Main.dc.html" style="height: 44px; padding: 0 14px; border-radius: 22px; background: #F4F5F7; color: #111318; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#111318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.1 5.55a2 2 0 0 0 1.8 0l3.65-1.83A1 1 0 0 1 21 4.62v12.76a1 1 0 0 1-.55.9l-4.56 2.27a2 2 0 0 1-1.78 0l-4.22-2.1a2 2 0 0 0-1.78 0l-3.66 1.83A1 1 0 0 1 3 19.38V6.62a1 1 0 0 1 .55-.9l4.56-2.27a2 2 0 0 1 1.78 0z"></path><path d="M15 5.76v15"></path><path d="M9 3.24v15"></path></svg>Ver en el mapa</a>
</div>
<div style="padding: 0 4px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 750; letter-spacing: -0.025em">Bao'an · OH BAY</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: #5B6270">12 fotos de 4 sitios</p>
</div>
<div role="group" aria-label="Qué fotos ver" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 22px; background: #F4F5F7">
<button type="button" aria-pressed="true" style="height: 36px; border-radius: 18px; border: 0; background: #FFFFFF; color: #111318; font: inherit; font-size: 14px; font-weight: 650; box-shadow: 0 1px 4px rgba(17,19,24,0.14)">Esta zona</button>
<button type="button" aria-pressed="false" style="height: 36px; border-radius: 18px; border: 0; background: transparent; color: #5B6270; font: inherit; font-size: 14px; font-weight: 550">Todo Shenzhen</button>
</div>
</div>

<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{tiles}}" as="tile" hint-placeholder-count="12">
<a href="Visor.dc.html" aria-label="{{tile.label}}" style="display: block; aspect-ratio: 3 / 4; background: {{tile.bg}}"></a>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var g = function (a) { return 'linear-gradient(180deg, ' + a[0] + ' 0%, ' + a[1] + ' 55%, ' + a[2] + ' 100%)'; };
    var photos = [
      ['Librería Zhongshuge', ['#675047', '#796156', '#59423b']],
      ['Noria Bay Glory', ['#bb809c', '#8f685d', '#4e4a49']],
      ['Paseo de OH BAY', ['#5c8dc5', '#7d96b0', '#615d58']],
      ['China Hi-Tech Fair', ['#707374', '#647e9d', '#525b6e']],
      ['Librería Zhongshuge', ['#7f7469', '#978470', '#675f58']],
      ['Noria Bay Glory', ['#9b9ead', '#beb4b3', '#9e8c7b']],
      ['China Hi-Tech Fair', ['#8489b2', '#7c8db5', '#86819e']],
      ['Paseo de OH BAY', ['#c1954c', '#c06f14', '#795931']],
      ['Librería Zhongshuge', ['#584545', '#635758', '#0b0b0a']],
      ['Noria Bay Glory', ['#cf9583', '#cd8e56', '#985114']],
      ['China Hi-Tech Fair', ['#cfdae7', '#788ea9', '#8083a6']],
      ['Librería Zhongshuge', ['#c4aeb2', '#c9a2a2', '#ab8d8b']]
    ];
    return {
      tiles: photos.map(function (p) { return { label: 'Foto de ' + p[0], bg: g(p[1]) }; })
    };
  }
}
</script>
</body>
</html>
