# Portainer: Git repository -> esta rama -> docker-compose.yml.
# Docker Standalone (no Swarm). No requiere archivos ni builds manuales en el host.
services:
  map-init:
    build:
      context: .
      target: map-init
    restart: "no"
    environment:
      MAP_BUILD: ${MAP_BUILD:-}
    volumes:
      - map_data:/maps

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    volumes:
      - api_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${WEB_PORT:-9012}:80"
    volumes:
      - map_data:/maps:ro
    depends_on:
      map-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

volumes:
  api_data:
  map_data:
