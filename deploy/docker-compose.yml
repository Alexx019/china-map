# En la Raspberry, dentro de la carpeta de despliegue (p. ej. /srv/china-map):
#   docker compose up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Estados y rutas compartidos (SQLite en un volumen: sobrevive a reinicios y despliegues)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    volumes:
      - api_data:/data
      - ./site:/site:ro

volumes:
  api_data:
  caddy_data:
  caddy_config:
